jdk:
  - openjdk17
# A single command: JitPack ignores failures in before_install, which would let Gradle
# publish without freshly built native libraries. The prepare script builds the natives
# from source, then runs the given task with a sha256-verified Gradle (the wrapper's only
# download URL redirects to GitHub releases, which are not always reachable from JitPack).
install:
  - bash scripts/jitpack_prepare.sh :openCV:publishToMavenLocal
